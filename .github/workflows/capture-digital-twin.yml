name: Capture real Sunway City Digital Twin screens

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-digital-twin.yml"
      - "scripts/capture-digital-twin.mjs"

permissions:
  contents: write

concurrency:
  group: fcri-twin-screenshots-fast
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Capture the public research site
        run: node scripts/capture-digital-twin.mjs
      - name: Commit and publish real captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Reset the index to the latest branch without discarding captured files.
          # This avoids binary add/add rebase conflicts when another run published images.
          git reset --mixed origin/main
          git add assets/digital-twin-desktop.jpg assets/digital-twin-mobile.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh screenshots from live Digital Twin [skip ci]"
            git push origin HEAD:main
          fi
